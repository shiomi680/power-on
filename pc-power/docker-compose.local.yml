version: '3.8'

# PC 電源管理サービス - ローカル・ビルド・パターン
# 開発時に Dockerfile を修正して、ローカル・イメージをビルド・実行する場合に使用
# 使用方法: cd pc-power && docker compose -f docker-compose.local.yml up -d

services:
  pc-power:
    build:
      context: .
      dockerfile: Dockerfile
    image: power-on-pc:local
    container_name: power-on-pc
    ports:
      - "5001:5001"
    environment:
      - FLASK_HOST=0.0.0.0
      - FLASK_PORT=5001
      - SHUTDOWN_TIMEOUT=${SHUTDOWN_TIMEOUT:-60}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5001/api/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
